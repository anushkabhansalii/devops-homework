# Final DevOps project (Session 21) - TaskBoard
#
#  backend tests ─┐                     ┌─ SAST (Bandit) ──────────┐
#  frontend build ┼─► (both pass) ──────┼─ SCA (pip-audit, npm) ───┤
#  terraform/IaC ─┘                     ├─ secret scan (gitleaks) ─┼─► SECURITY GATE ─► push to GHCR ─► deploy test (kind + Helm)
#                                       └─ docker build ─► Trivy ──┘                                          │
#                                                                                                             ▼
#                                         GitOps: bump image tags in helm/taskboard/values-prod.yaml ─► Argo CD syncs the cluster
name: "Final Project - TaskBoard CI/CD"

on:
  push:
    branches: [main]
    paths:
      - "final-devops-project/application/**"
      - "final-devops-project/docker/**"
      - "final-devops-project/helm/**"
      - "final-devops-project/terraform/**"
      - "final-devops-project/security/**"
      - ".github/workflows/final-project.yml"
  pull_request:
    paths:
      - "final-devops-project/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-project-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: final-devops-project
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0

jobs:
  # ---------------------------------------------------------------- build & test
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-devops-project/application/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: final-devops-project/application/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: final-devops-project/application/backend/coverage.xml

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-devops-project/application/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: final-devops-project/application/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: final-devops-project/application/frontend/dist

  iac-check:
    name: IaC check (Terraform + Helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / init / validate
        working-directory: final-devops-project/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint final-devops-project/helm/taskboard -f final-devops-project/helm/taskboard/values-prod.yaml
          helm template taskboard final-devops-project/helm/taskboard -f final-devops-project/helm/taskboard/values-prod.yaml > /dev/null
      - name: IaC misconfiguration scan (informational)
        run: |
          # one target: the project folder (Terraform, Helm chart and Dockerfiles)
          docker run --rm -v "$PWD:/src" $TRIVY_IMAGE config --severity HIGH,CRITICAL --exit-code 0 /src/final-devops-project

  # ---------------------------------------------------------------- security
  sast:
    name: SAST (Bandit)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4
      - working-directory: final-devops-project/application/backend
        run: |
          bandit -r app -f json -o bandit-report.json --exit-zero
          bandit -r app -ll -ii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: final-devops-project/application/backend/bandit-report.json

  sca:
    name: SCA (pip-audit + npm audit)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python dependencies
        working-directory: final-devops-project/application/backend
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt --desc on
      - name: npm dependencies
        working-directory: final-devops-project/application/frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the project's full git history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" \
            $GITLEAKS_IMAGE git . --log-opts="-- $PROJECT" --config $PROJECT/security/gitleaks.toml --redact -v

  docker-build:
    name: Docker build (${{ matrix.component }})
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build -f $PROJECT/docker/${{ matrix.component }}.Dockerfile \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t taskboard-${{ matrix.component }}:${GITHUB_SHA::7} \
            $PROJECT/application/${{ matrix.component }}
          docker save taskboard-${{ matrix.component }}:${GITHUB_SHA::7} -o /tmp/${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp/${{ matrix.component }}.tar
          retention-days: 1

  image-scan:
    name: Image scan (${{ matrix.component }}, Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp
      - run: docker load -i /tmp/${{ matrix.component }}.tar
      - name: Scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE image --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 taskboard-${{ matrix.component }}:${GITHUB_SHA::7}

  security-gate:
    name: Security gate
    needs: [sast, sca, secret-scan, image-scan, iac-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Security gate"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| SAST (Bandit) | ${{ needs.sast.result }} |"
            echo "| SCA (pip-audit + npm audit) | ${{ needs.sca.result }} |"
            echo "| Secret scan (gitleaks) | ${{ needs.secret-scan.result }} |"
            echo "| Image scan (Trivy) | ${{ needs.image-scan.result }} |"
            echo "| IaC check (Terraform + Helm) | ${{ needs.iac-check.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.sast.result }}" "${{ needs.sca.result }}" "${{ needs.secret-scan.result }}" "${{ needs.image-scan.result }}" "${{ needs.iac-check.result }}"; do
            [ "$r" = "success" ] || { echo "::error::Security gate FAILED - nothing will be pushed or deployed"; exit 1; }
          done
          echo "Security gate PASSED"

  # ---------------------------------------------------------------- deliver
  push:
    name: Push images (GHCR)
    needs: security-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp
      - run: |
          docker load -i /tmp/${{ matrix.component }}.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${GITHUB_SHA::7} latest; do
            docker tag taskboard-${{ matrix.component }}:${GITHUB_SHA::7} $REGISTRY/taskboard-${{ matrix.component }}:$tag
            docker push $REGISTRY/taskboard-${{ matrix.component }}:$tag
          done

  deploy-test:
    name: Deploy test (kind + Helm)
    needs: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: taskboard-ci
      - uses: azure/setup-helm@v4
      - name: helm install (images pulled from GHCR)
        run: |
          helm upgrade --install taskboard $PROJECT/helm/taskboard -n taskboard --create-namespace \
            -f $PROJECT/helm/taskboard/values-prod.yaml \
            --set backend.image.tag=${GITHUB_SHA::7} --set frontend.image.tag=${GITHUB_SHA::7} \
            --set postgres.existingSecret= --set postgres.password=ci-only-password \
            --set ingress.enabled=false --set hpa.enabled=false \
            --set monitoring.serviceMonitor=false --set monitoring.alerts=false \
            --wait --timeout 5m
          kubectl -n taskboard get pods,svc,pvc
      - name: Smoke test through the frontend (nginx -> API -> PostgreSQL)
        run: |
          kubectl -n taskboard port-forward svc/taskboard-frontend 8080:80 >/dev/null 2>&1 &
          sleep 4
          curl -sf localhost:8080/api/info
          curl -sf -X POST localhost:8080/api/tasks -H 'Content-Type: application/json' -d '{"title":"CI smoke test","priority":"HIGH"}'
          curl -sf localhost:8080/api/tasks/stats
          curl -sf localhost:8080/ | grep -q '<title>TaskBoard</title>' && echo "frontend OK"
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n taskboard get pods -o wide
          kubectl -n taskboard describe pods | tail -60
          kubectl -n taskboard logs deploy/taskboard-backend --all-containers --tail=50 || true

  gitops-promote:
    name: GitOps - promote to production
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Bump image tags in values-prod.yaml and push (Argo CD deploys it)
        run: |
          FILE=$PROJECT/helm/taskboard/values-prod.yaml
          sed -i -E "s/^(    tag: ).*/\1\"${GITHUB_SHA::7}\"/" $FILE
          git diff -- $FILE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): deploy taskboard ${GITHUB_SHA::7} to prod [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
