# Session 16 homework: the class "10-final-cicd-pipeline" (calculator) run in my own repo.
# test -> build (needs: test, uploads an artifact) and a security-check job in parallel with build.
name: Final CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "github-actions-cicd/final-cicd-pipeline/**"
      - ".github/workflows/session16-final-pipeline.yml"
  pull_request:
    paths:
      - "github-actions-cicd/final-cicd-pipeline/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: github-actions-cicd/final-cicd-pipeline

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Display Python version
        run: python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Show build output
        run: cat build/build-info.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: github-actions-cicd/final-cicd-pipeline/build/

  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Check for sensitive files
        run: |
          echo "Checking repository for common sensitive files..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          else
            echo "No common sensitive files found."
          fi
