# Session 16 - CD: runs only after "Session 16 - CI" succeeds on main.
# publish: build + push image to GitHub Container Registry (ghcr.io) using GITHUB_TOKEN
# deploy:  create a throwaway kind cluster on the runner, deploy the image, smoke test it.
name: "Session 16 - CD"

on:
  workflow_run:
    workflows: ["Session 16 - CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/calculator-api

jobs:
  publish:
    name: Publish image to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: github-actions-cicd
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cd-demo
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image and load it into kind
        run: |
          docker pull $IMAGE:${{ needs.publish.outputs.tag }}
          docker tag $IMAGE:${{ needs.publish.outputs.tag }} calculator-api:${{ needs.publish.outputs.tag }}
          kind load docker-image calculator-api:${{ needs.publish.outputs.tag }} --name cd-demo
      - name: Deploy manifests
        working-directory: github-actions-cicd
        run: |
          sed -i "s/IMAGE_TAG/${{ needs.publish.outputs.tag }}/" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/calculator-api --timeout=120s
          kubectl get pods,svc -o wide
      - name: Smoke test through the Service
        run: |
          kubectl port-forward svc/calculator-api 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -sf localhost:8080/health
          curl -s localhost:8080/
          curl -s "localhost:8080/api/multiply?a=6&b=7"
