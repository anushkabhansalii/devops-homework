apiVersion: v1
kind: Pod
metadata:
  name: fail-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal service...";
          # FIX: a Service that really exists, using its correct FQDN <svc>.<namespace>.svc.cluster.local
          curl -s --connect-timeout 3 http://troubleshooting-service.default.svc.cluster.local | grep -i "<title>" || true
          echo "Process sleeping...";
          sleep 3600
