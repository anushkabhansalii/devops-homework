apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-u"                                   # unbuffered output so kubectl logs shows prints
        - "-c"
        - |
          import time
          print("Allocating memory rapidly...")
          chunks = []
          for i in range(20):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print("Allocated", len(chunks) * 10, "MB - running normally")
          time.sleep(3600)
      resources:
        requests:
          memory: "256Mi"
        limits:
          memory: "512Mi"                        # FIX: limit sized to what the app actually uses (~200MB)
