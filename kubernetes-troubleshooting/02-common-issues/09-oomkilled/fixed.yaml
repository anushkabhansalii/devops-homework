apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: memory-hog
      image: python:3.11-alpine
      command: ["python3", "-u", "-c"]   # -u = unbuffered stdout so kubectl logs shows prints immediately
      args:
        - |
          import time
          print("Allocating 100MB...")
          data = [b"x" * (10 * 1024 * 1024) for _ in range(10)]
          print("Allocated, serving...")
          time.sleep(3600)
      resources:
        limits:
          memory: 256Mi
