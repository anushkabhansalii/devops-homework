apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  storageClassName: ""        # without this, minikube's default "standard" class
                              # would dynamically provision a new PV instead of
                              # binding to our manually created student-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
