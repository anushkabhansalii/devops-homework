# Source: taskboard/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskboard-postgres
  labels:
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  serviceName: taskboard-postgres
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-postgres
  template:
    metadata:
      labels:
        app: taskboard-postgres
        app.kubernetes.io/part-of: taskboard
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: taskboard-1.0.0
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "taskboard"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: taskboard-db
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 15
            failureThreshold: 4
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run              # unix socket + lock files
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

