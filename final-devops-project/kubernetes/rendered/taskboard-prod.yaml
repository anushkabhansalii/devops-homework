# Source: taskboard/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard-prod.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskboard-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskboard-frontend
                port: {name: http}

