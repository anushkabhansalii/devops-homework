# Source: taskboard/templates/monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskboard-alerts
  labels:
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  groups:
    - name: taskboard.rules
      rules:
        - alert: TaskBoardBackendDown
          expr: (kube_deployment_status_replicas_available{namespace="taskboard-prod", deployment="taskboard-backend"} or on() vector(0)) < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: TaskBoard API has no ready pods
        - alert: TaskBoardHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="taskboard-prod", status=~"5.*"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="taskboard-prod"}[5m])), 1e-9) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of API requests fail ({{ $value | humanizePercentage }})"
        - alert: TaskBoardSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="taskboard-prod", handler!="/metrics"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "p95 API latency above 500ms"
        - alert: TaskBoardPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="taskboard-prod"}[10m]) > 2
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.pod }} restarted more than twice in 10 minutes"

