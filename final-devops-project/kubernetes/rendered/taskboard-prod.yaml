# Source: taskboard/templates/monitoring.yaml
# Prometheus scrapes the backend's /metrics (prometheus-fastapi-instrumentator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskboard-backend
  labels:
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  selector:
    matchLabels:
      app: taskboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
