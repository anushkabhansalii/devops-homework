# Source: taskboard/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
        app.kubernetes.io/part-of: taskboard
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: taskboard-1.0.0
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 101
      containers:
        - name: frontend
          image: "ghcr.io/anushkabhansalii/taskboard-frontend:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://taskboard-backend:8000"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:          # nginx needs a few writable dirs when the root FS is read-only
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /tmp}
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: conf, emptyDir: {}}

