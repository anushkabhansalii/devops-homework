# Source: taskboard/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-backend
  labels:
    app: taskboard-backend
    app.kubernetes.io/part-of: taskboard
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taskboard-1.0.0
    environment: prod
spec:
  selector:
    matchLabels:
      app: taskboard-backend
  template:
    metadata:
      labels:
        app: taskboard-backend
        app.kubernetes.io/part-of: taskboard
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: taskboard-1.0.0
        environment: prod
      annotations:
        checksum/config: ce2ca5b917a73ec6597404359c21a081d9f3e53f5e3dbd29ab4180416f7a068e
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
      initContainers:
        # don't start the API (and its DB migrations) until PostgreSQL accepts connections
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 $(DB_HOST) $(DB_PORT); do echo waiting for $(DB_HOST):$(DB_PORT); sleep 2; done"]
          envFrom:
            - configMapRef:
                name: taskboard-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: backend
          image: "ghcr.io/anushkabhansalii/taskboard-backend:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskboard-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskboard-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40          # migrations + start get up to 2 minutes
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

