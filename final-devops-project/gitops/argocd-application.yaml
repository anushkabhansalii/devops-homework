# Argo CD Application for TaskBoard production. Applied once by an admin:
#   kubectl apply -f final-devops-project/gitops/argocd-application.yaml
# Argo CD then renders the Helm chart from Git with values-prod.yaml and keeps the cluster in sync.
# The CI/CD pipeline never touches the cluster - it only commits new image tags to values-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anushkabhansalii/devops-homework.git
    targetRevision: main
    path: final-devops-project/helm/taskboard
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
