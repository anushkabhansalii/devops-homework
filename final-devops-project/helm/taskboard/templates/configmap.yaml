apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "taskboard.labels" . | nindent 4 }}
data:
  APP_NAME: "TaskBoard API"
  ENVIRONMENT: {{ .Values.environment | quote }}
  DB_HOST: {{ .Release.Name }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
