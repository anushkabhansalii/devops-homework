{{- if .Values.monitoring.serviceMonitor }}
# Prometheus scrapes the backend's /metrics (prometheus-fastapi-instrumentator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  groups:
    - name: taskboard.rules
      rules:
        - alert: TaskBoardBackendDown
          expr: (kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="{{ .Release.Name }}-backend"} or on() vector(0)) < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: TaskBoard API has no ready pods
        - alert: TaskBoardHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.*"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1e-9) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of API requests fail ({{ "{{" }} $value | humanizePercentage {{ "}}" }})"
        - alert: TaskBoardSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", handler!="/metrics"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "p95 API latency above 500ms"
        - alert: TaskBoardPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[10m]) > 2
          labels: {severity: warning}
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }} restarted more than twice in 10 minutes"
{{- end }}
{{- if .Values.monitoring.dashboard }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "taskboard.labels" . | nindent 4 }}
data:
  taskboard.json: |-
{{ .Files.Get "dashboards/taskboard.json" | indent 4 }}
{{- end }}
